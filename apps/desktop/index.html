<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f4f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1d1c" media="(prefers-color-scheme: dark)" />
    <title>oopz</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <script src="/boot.js"></script>
    <style>
      /* The loading screen: plain CSS in the page, so it shows on the first frame, before the app's code has loaded.
         Its colours are the app's (src/app.css); src/main.ts fades it out once the app is on screen. */
      html, body { margin: 0; background: #f6f4f0; }
      #splash { position: fixed; inset: 0; top: 0; right: 0; bottom: 0; left: 0; z-index: 9999; display: flex;
        flex-direction: column; align-items: center; justify-content: center; background: #f6f4f0; color: #1d201d;
        font: 600 22px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: opacity 0.25s ease; }
      #splash svg { width: 72px; height: 72px; margin-bottom: 14px; }
      #splash .dots { display: flex; margin-top: 18px; }
      #splash .dots i { width: 7px; height: 7px; margin: 0 4px; border-radius: 50%; background: #2f5d4f; opacity: 0.25;
        animation: oopz-pulse 1.1s infinite ease-in-out; }
      #splash .dots i:nth-child(2) { animation-delay: 0.18s; }
      #splash .dots i:nth-child(3) { animation-delay: 0.36s; }
      #splash .err { max-width: 320px; margin: 18px 24px 0; font-weight: 400; font-size: 15px; text-align: center; }
      #splash.gone { opacity: 0; pointer-events: none; }
      @keyframes oopz-pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #splash .dots i { animation: none; opacity: 0.6; } #splash { transition: none; } }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]), html:not([data-theme="light"]) body,
        html:not([data-theme="light"]) #splash { background: #1b1d1c; color: #e9ebe7; }
      }
      html[data-theme="dark"], html[data-theme="dark"] body, html[data-theme="dark"] #splash { background: #1b1d1c; color: #e9ebe7; }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="oopz">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="15" fill="#2f5d4f" />
        <path d="M17.5 32a14.5 14.5 0 1 0 4.25-10.25" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" />
        <path d="M15.5 14.5v10.25h10.25" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="32" cy="32" r="3.6" fill="#fff" />
      </svg>
      oopz
      <div class="dots"><i></i><i></i><i></i></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
