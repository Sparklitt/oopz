[package]
name = "oopz-desktop"
description = "oopz as a desktop app: your own WhatsApp backups, step by step (decision 0009)."
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-or-later"
publish = false

# Its own workspace: Tauri needs a webview toolkit to build, which the library's checks and CI don't
# (docs/desktop-plan.md). Checked on its own: `cargo clippy -j 2 --all-targets` in this folder.
[workspace]

[lib]
name = "oopz_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
oopz = { path = "../../../crates/oopz" }
oopz-app = { path = "../../../crates/oopz-app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Android: reading a picked backup and writing a result through content:// references (decision 0012, point 3), from
# Rust only; the webview is given no fs permission.
tauri-plugin-fs = "2"
open = "5"
tempfile = "3"
zeroize = { version = "1", features = ["serde"] }

[dev-dependencies]
oopz = { path = "../../../crates/oopz", features = ["fixtures"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
opt-level = "s"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
