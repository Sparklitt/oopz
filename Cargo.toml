[workspace]
resolver = "3"
members = ["crates/ios-backup", "crates/oopz-app", "crates/oopz-cli", "crates/oopz-core", "crates/oopz-export", "crates/oopz-export-pdf", "crates/oopz-gen", "crates/oopz-model", "crates/adapters/*"]
# The Tauri shell has its own workspace: it needs a webview toolkit to build (docs/desktop-plan.md).
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
# Off until the first release is decided: `cargo publish` refuses while this is false.
publish = false

[workspace.dependencies]
oopz = { path = "crates/adapters/whatsapp-android" }
oopz-app = { path = "crates/oopz-app" }
oopz-model = { path = "crates/oopz-model" }
oopz-core = { path = "crates/oopz-core" }
oopz-export = { path = "crates/oopz-export" }
oopz-export-pdf = { path = "crates/oopz-export-pdf" }
oopz-ios-backup = { path = "crates/ios-backup" }
oopz-whatsapp-ios = { path = "crates/adapters/whatsapp-ios" }
oopz-whatsapp-export = { path = "crates/adapters/whatsapp-export" }
oopz-telegram-export = { path = "crates/adapters/telegram-export" }
oopz-sms-xml = { path = "crates/adapters/sms-xml" }
oopz-line-export = { path = "crates/adapters/line-export" }
oopz-viber-export = { path = "crates/adapters/viber-export" }

# docs/decisions/0004 for the cryptography crates; nothing else may be added without a record.
aes-gcm = "0.11"
hkdf = "0.13"
sha2 = "0.11"
prost = "0.14"
zeroize = "1"
rpassword = "7"
hex = "0.4"
flate2 = "1"
# docs/decisions/0006: the backup footer (not for security) and a fresh IV.
md-5 = "0.11"
getrandom = "0.4"
# docs/decisions/0018: an iPhone backup encrypted with its owner's password (keybag: PBKDF2 then AES key wrap; files:
# AES-256-CBC), and its property lists.
aes = "0.9"
aes-kw = "0.3"
cbc = "0.2"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha1 = "0.11"
plist = { version = "1", default-features = false }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
# SQLite built from source (FTS3/FTS5 included, as WhatsApp's tables need). oopz never needs SQLCipher: the backup is
# decrypted by crypt15.rs, not by SQLite.
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
tempfile = "3"
thiserror = "2"
# docs/decisions/0009: the desktop app's logic (results for the UI, the Wi-Fi receive page and its QR code).
serde = { version = "1", features = ["derive"] }
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# docs/decisions/0009: free disk space before writing a decrypted copy or a merge.
fs4 = { version = "1.1", default-features = false }
# Photo thumbnails for the chat viewer, from the phone's Media folder: pure-Rust decoders for the formats WhatsApp saves.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# docs/decisions/0015: reading the apps' official exports (Telegram's JSON, SMS Backup & Restore's XML, Viber's CSV,
# MMS parts in base64).
serde_json = "1"
quick-xml = "0.39"
csv = "1"
base64 = "0.22"
# docs/decisions/0017: the PDF export (its own crate, behind the `pdf` feature): a PDF writer with font embedding
# (colour emoji included), text shaping, and the Unicode bidirectional algorithm for right-to-left text.
krilla = "0.8"
rustybuzz = "0.20"
unicode-bidi = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
strip = "symbols"
