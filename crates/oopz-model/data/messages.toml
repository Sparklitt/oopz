# Every sentence oopz writes, by language: compiled by build.rs with msgkinds' generator into
# `oopz_model::messages::Message` (msgkinds' docs/messages.md has the format and its checks). `name` is stable: notes
# are stored by it, so never rename or reuse one; add a new one instead. `for = "user"`: shown to people, in every
# language; `"developer"`: a programming mistake's, English only. `plural = "count"`: a counted message, each
# language giving its CLDR forms (`en_one`, `en_other`, `es_one`, `es_many`, `es_other`; Spanish `many` is `other`'s
# wording, as counts are digits; msgkinds' docs/messages.md "Plurals").

catalog = "oopz"
languages = ["en", "es"]

