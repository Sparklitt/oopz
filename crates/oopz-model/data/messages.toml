# Every sentence oopz writes, by language: compiled by build.rs with msgkinds' generator into
# `oopz_model::messages::Message` (msgkinds' docs/messages.md has the format and its checks). `name` is stable: notes
# are stored by it, so never rename or reuse one; add a new one instead. `for = "user"`: shown to people, in every
# language; `"developer"`: a programming mistake's, English only.

catalog = "oopz"
languages = ["en", "es"]

# An import's notes: what an adapter kept as unknown or read around. Counts and codes only, never message text.

[[message]]
name = "wall_clock_utc"
for = "user"
params = []
en = "times are the phone's local time, read as UTC: the export doesn't say its time zone"
es = "las horas son las locales del teléfono, leídas como UTC: la exportación no dice su zona horaria"

