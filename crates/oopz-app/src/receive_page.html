<!doctype html>
<html lang="{{language}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title data-t="receive_page_tab"></title>
<style>
  :root { --bg: #FFF7EE; --card: #FFFFFF; --ink: #23244F; --soft: #6B6C8F; --line: #E4D9CC; --coral: #F2604F; --ok: #2E8B57; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15162E; --card: #26284F; --ink: #F6F0E7; --soft: #A9AACB; --line: #34366A; --coral: #FF7565; --ok: #8FD9A8; }
  }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: .5rem 0; }
  p, li { color: var(--soft); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 12px 0; }
  code { font-size: .85em; word-break: break-all; }
  button, label.pick { display: block; width: 100%; box-sizing: border-box; padding: 14px; margin: 8px 0; border: 0;
    border-radius: 12px; font: inherit; font-weight: 600; text-align: center; cursor: pointer; }
  label.pick, #send { background: var(--coral); color: #fff; }
  #done { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: .5; }
  input[type=file] { display: none; }
  .file { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
  .file span:first-child { overflow-wrap: anywhere; }
  progress { width: 100%; accent-color: var(--coral); }
  .ok { color: var(--ok); } .bad { color: var(--coral); }
</style>
</head>
<body>
<main>
  <h1 data-t="receive_page_title"></h1>
  <div class="card">
    <p data-t="receive_page_where"></p>
    <label class="pick"><span data-t="receive_page_pick"></span><input id="files" type="file" multiple></label>
    <div id="list"></div>
    <button id="send" disabled data-t="receive_page_send"></button>
    <button id="done" data-t="receive_page_done"></button>
  </div>
  <p data-t="receive_page_privacy"></p>
</main>
<!-- The page's words in the phone's language, message name → wording, put in by the computer (receive/page.rs). -->
<script id="words" type="application/json">{{words}}</script>
<script>
"use strict";
const W = JSON.parse(document.getElementById("words").textContent);
for (const el of document.querySelectorAll("[data-t]")) el.textContent = W[el.dataset.t];

// answer: begin (scripts/check-receive-page.mjs tests this function on its own)
// What a file's row says after the computer answered: received when it says so with the file's size; else why, by
// its code (`receive_refused_…`), or the code itself when this page doesn't know it (a newer computer), or the HTTP
// status when the body isn't a code (a proxy's error page): never the body as it came.
function answer(status, body, size, W) {
  const text = String(body || "").trim();
  const bytes = Number(text.split(" ")[0]);
  if (status === 200 && bytes === size) return { ok: true, text: W.receive_page_ok };
  const known = /^[a-z_]{1,64}$/.test(text);
  const why = known && Object.prototype.hasOwnProperty.call(W, text) && text.startsWith("receive_refused_") ? W[text]
    : known ? text : "HTTP " + status;
  return { ok: false, text: W.receive_page_bad + " (" + why + ")" };
}
// answer: end

const input = document.getElementById("files"), list = document.getElementById("list");
const send = document.getElementById("send"), done = document.getElementById("done");
let rows = [];
input.addEventListener("change", () => {
  list.textContent = "";
  rows = Array.from(input.files).map((file) => {
    const row = document.createElement("div"), name = document.createElement("span"), state = document.createElement("span");
    const bar = document.createElement("progress");
    row.className = "file"; name.textContent = file.name; state.textContent = (file.size / 1e6).toFixed(1) + " MB";
    bar.max = 1; bar.value = 0;
    row.append(name, state); list.append(row, bar);
    return { file, state, bar };
  });
  send.disabled = rows.length === 0;
});

function upload(r) {
  return new Promise((resolve) => {
    const xhr = new XMLHttpRequest();
    xhr.open("PUT", "files/" + encodeURIComponent(r.file.name));
    xhr.upload.onprogress = (e) => { if (e.lengthComputable) r.bar.value = e.loaded / e.total; };
    xhr.onload = () => {
      const a = answer(xhr.status, xhr.responseText, r.file.size, W);
      r.state.textContent = a.text;
      r.state.className = a.ok ? "ok" : "bad";
      resolve();
    };
    xhr.onerror = () => { r.state.textContent = W.receive_page_bad; r.state.className = "bad"; resolve(); };
    xhr.send(r.file);
  });
}

send.addEventListener("click", async () => {
  send.disabled = true;
  for (const r of rows) await upload(r);
});
done.addEventListener("click", async () => {
  try { await fetch("done", { method: "POST" }); } catch (e) {}
  document.querySelector("main").textContent = W.receive_page_closed;
});
</script>
</body>
</html>
