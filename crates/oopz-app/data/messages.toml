# Every sentence the desktop app's logic (oopz-app) and its shell (apps/desktop/src-tauri) write, by language:
# compiled by build.rs with msgkinds' generator into `oopz_app::messages::Message` (msgkinds' docs/messages.md has the
# format and its checks). `name` is stable: notes are stored by it, so never rename or reuse one; add a new one
# instead. `for = "user"`: shown to people, in every language; `"developer"`: a programming mistake's, English only.
# `plural = "count"`: a counted message (msgkinds' docs/messages.md "Plurals"; Spanish `many` is `other`'s wording, as
# counts are digits). Spanish follows apps/desktop/src/lib/i18n/es.ts where it has the same sentence. A value whose
# gender isn't known (a path, a name) never stands next to a gendered word (docs/messages.md "Agreement").

catalog = "oopz_app"
languages = ["en", "es"]

# Errors (`AppError`). What was being done is a `doing_…` note, of this catalog or oopz's; the system's reason is a
# value, as the system wrote it.

