[package]
name = "oopz-gen"
description = "Synthetic WhatsApp backups and official text exports for testing oopz: invented people, chats and messages of every kind, at any size."
license.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "oopz-gen"
path = "src/main.rs"

[dependencies]
msgkinds.workspace = true
# The `fixtures` feature gives `crypt15::encrypt`: test data only, never for a real backup.
oopz = { workspace = true, features = ["fixtures"] }
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
oopz-model.workspace = true
oopz-ios-backup = { workspace = true, features = ["write"] }
rusqlite.workspace = true
serde_json.workspace = true
sha2.workspace = true
zip.workspace = true

[dev-dependencies]
oopz-app.workspace = true
oopz-model.workspace = true
oopz-core.workspace = true
tempfile.workspace = true

[lints]
workspace = true
