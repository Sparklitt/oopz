[package]
name = "oopz-gen"
description = "Synthetic WhatsApp backups for testing oopz: invented people, chats and messages of every kind, at any size."
license.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "oopz-gen"
path = "src/main.rs"

[dependencies]
# The `fixtures` feature gives `crypt15::encrypt`: test data only, never for a real backup.
oopz = { workspace = true, features = ["fixtures"] }
anyhow.workspace = true
clap.workspace = true
rusqlite.workspace = true
sha2.workspace = true

[dev-dependencies]
oopz-app.workspace = true
oopz-model.workspace = true
tempfile.workspace = true

[lints]
workspace = true
