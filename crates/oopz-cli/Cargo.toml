[package]
name = "oopz-cli"
description = "oopz from a terminal: a person's own WhatsApp backups (decision 0007) and every app's history in one library (0016)."
license.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "oopz"
path = "src/main.rs"

[features]
default = ["pdf"]
# PDF export (decision 0017).
pdf = ["dep:oopz-export-pdf"]

[dependencies]
oopz-app.workspace = true
oopz-core.workspace = true
oopz-export.workspace = true
oopz-export-pdf = { workspace = true, optional = true }
oopz-model.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
jiff.workspace = true
rpassword.workspace = true
tempfile.workspace = true
zeroize.workspace = true

[dev-dependencies]
oopz = { workspace = true, features = ["fixtures"] }
oopz-gen = { path = "../oopz-gen" }
tempfile.workspace = true

[lints]
workspace = true
