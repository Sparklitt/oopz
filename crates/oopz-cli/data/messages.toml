[[message]]
name = "wifi_tips"
for = "user"
params = []
en = "The phone hasn't opened the page yet. What usually helps:\n  - Put the phone and this computer on the same Wi-Fi (on the phone, Wi-Fi on, not mobile data).\n  - Guest networks and some routers keep devices apart: turn on the phone's hotspot and connect this computer to it.\n    The page still never goes through the internet.\n  - Pause any VPN on the phone or on this computer.\n  - On Windows: allow oopz on private networks when the firewall asks, and set this network as Private.\n  - Try another address with --address."
es = "El teléfono aún no ha abierto la página. Lo que suele ayudar:\n  - Pon el teléfono y este ordenador en el mismo Wi-Fi. En el teléfono: Wi-Fi activado, no datos móviles.\n  - Las redes de invitados y algunos routers aíslan los dispositivos. Activa el punto de acceso del teléfono y conecta\n    este ordenador a él: la página sigue sin pasar por internet.\n  - Pausa cualquier VPN en el teléfono o en este ordenador.\n  - En Windows: permite oopz en redes privadas cuando lo pregunte el cortafuegos, y marca esta red como Privada.\n  - Prueba otra dirección con --address."

