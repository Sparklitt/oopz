# Every sentence the `oopz` command prints, by language: compiled by build.rs with msgkinds' generator into
# `crate::say::Message` (msgkinds' docs/messages.md has the format and its checks). The language is the terminal's
# (LC_ALL, LC_MESSAGES, LANG). `name` is stable: never rename or reuse one; add a new one instead. Spanish follows the
# desktop app's (apps/desktop/src/lib/i18n/es.ts) where it has the same sentence. Indentation and table widths stay in
# the code; a wording never starts or ends with a space.

catalog = "oopz_cli"
languages = ["en", "es"]

# Every command.

[[message]]
name = "error_line"
for = "user"
params = ["error"]
en = "error: {error}"
