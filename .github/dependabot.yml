version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # New cryptography crates need a decision record (docs/decisions/0004); version bumps of the existing ones are
    # reviewed like any other change.
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # This action's tag is the Rust version (the msrv job's @1.92 is rust-version in Cargo.toml): raising it is a
    # decision, not an update.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]
