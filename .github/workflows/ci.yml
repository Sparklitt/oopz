name: CI

# The required check on main: scripts/check.sh, the one definition of done, on Linux. Installers for every platform
# are built by hand (desktop-build.yml). msgkinds is a private path dependency, checked out beside oopz with a
# read-only deploy key (secret MSGKINDS_DEPLOY_KEY).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: oopz
      - uses: actions/checkout@v4
        with:
          repository: Sparklitt/msgkinds
          ssh-key: ${{ secrets.MSGKINDS_DEPLOY_KEY }}
          path: msgkinds
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            oopz -> target
            oopz/apps/desktop/src-tauri -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: oopz/apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: oopz/apps/desktop/pnpm-lock.yaml
      - run: bash scripts/check.sh
        working-directory: oopz
