name: Desktop installers

# Builds the desktop app's installers and the `oopz` CLI on Linux, Windows and macOS, and the Android APK. Started by hand (Actions › Desktop installers › Run
# workflow), it keeps them as the run's artifacts with their SHA-256 checksums and publishes nothing. A pushed tag
# `vX.Y.Z` also makes a DRAFT GitHub Release from them, with one SHA256SUMS.txt, build provenance (artifact
# attestations) and the CHANGELOG's notes for that version; a person reviews and publishes it. The installers are
# unsigned (decided for the first release: Windows SmartScreen and macOS Gatekeeper warn; the README says what to do).
# The updater's files are signed with the updater key (decision 0011), and the release gets the `latest.json` that
# installed copies read when the person asks them to check for updates.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: an older glibc, so the AppImage and .deb run on more Linux systems.
          - { os: ubuntu-22.04, name: linux, args: "" }
          - { os: windows-latest, name: windows, args: "" }
          - { os: macos-latest, name: macos, args: "--target universal-apple-darwin" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      # `tauri build` runs `pnpm build` first (beforeBuildCommand), then cargo with the shell's Cargo.lock.
      - run: pnpm tauri build ${{ matrix.args }} -- --locked
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Collect installers and checksums
        shell: bash
        run: |
          mkdir -p ../../out
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \
               -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -exec cp {} ../../out/ \;
          cd ../../out
          # The macOS update is named oopz.app.tar.gz; give it the version like the other files.
          if [ -f oopz.app.tar.gz ]; then
            version=$(jq -r .version ../apps/desktop/src-tauri/tauri.conf.json)
            mv oopz.app.tar.gz "oopz_${version}_universal.app.tar.gz"
            mv oopz.app.tar.gz.sig "oopz_${version}_universal.app.tar.gz.sig"
          fi
          ls -la
          if command -v sha256sum >/dev/null; then sha256sum * > SHA256SUMS-${{ matrix.name }}.txt; else shasum -a 256 * > SHA256SUMS-${{ matrix.name }}.txt; fi
      - uses: actions/upload-artifact@v4
        with:
          name: oopz-desktop-${{ matrix.name }}
          path: out/
          if-no-files-found: error

  # The `oopz` command-line tool, for the same systems: one archive per system with the binary, LICENSE and README.
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: universal-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = universal-apple-darwin ]; then
            cargo build --locked --release -p oopz-cli --target aarch64-apple-darwin
            cargo build --locked --release -p oopz-cli --target x86_64-apple-darwin
            mkdir -p target/universal-apple-darwin/release
            lipo -create -output target/universal-apple-darwin/release/oopz \
              target/aarch64-apple-darwin/release/oopz target/x86_64-apple-darwin/release/oopz
          else
            cargo build --locked --release -p oopz-cli --target ${{ matrix.target }}
          fi
      - name: Package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="oopz-cli-${version}-${{ matrix.target }}"
          exe=oopz; [ "${{ runner.os }}" = Windows ] && exe=oopz.exe
          mkdir -p "$name" out
          cp "target/${{ matrix.target }}/release/$exe" LICENSE README.md "$name/"
          "$name/$exe" --version
          if [ "${{ runner.os }}" = Windows ]; then 7z a "out/$name.zip" "$name" >/dev/null; else tar czf "out/$name.tar.gz" "$name"; fi
          cd out
          if command -v sha256sum >/dev/null; then sha256sum * > "SHA256SUMS-cli-${{ matrix.target }}.txt"; else shasum -a 256 * > "SHA256SUMS-cli-${{ matrix.target }}.txt"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: oopz-cli-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  android:
    # The Android APK (decision 0012), for 64- and 32-bit ARM phones. Signed with the oopz release keystore from the
    # repo secrets, written to a temporary file for the build and never printed; without the secret (a fork), unsigned.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: NDK
        run: |
          sdkmanager --install "ndk;30.0.16248370" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Build
        working-directory: apps/desktop
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          pnpm install --frozen-lockfile
          if [ -n "$ANDROID_KEYSTORE" ]; then
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/oopz-release.jks"
            printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          fi
          pnpm tauri android build --apk --target aarch64 --target armv7
          rm -f "$RUNNER_TEMP/oopz-release.jks"
      - name: Package
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          apk=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk' | head -1)
          test -n "$apk"
          mkdir -p out
          cp "$apk" "out/oopz_${version}_android.apk"
          # A release is always signed: phones can't update an unsigned or differently signed APK.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          if "$apksigner" verify --print-certs "out/oopz_${version}_android.apk" > certs.txt; then
            grep 'SHA-256' certs.txt
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "the APK isn't signed" >&2; exit 1
          fi
          cd out && sha256sum * > SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: oopz-android
          path: out/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, cli, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the draft release
      id-token: write # signing the provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the app's version
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
      - uses: actions/download-artifact@v4
        with:
          pattern: oopz-*
          path: out
          merge-multiple: true
      - name: Notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The CHANGELOG's section for this version, without its heading, its wrapped lines joined (release notes
          # keep every line break).
          awk -v h="## [$version]" 'index($0, h) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md \
            | awk 'NF == 0 { if (p != "") print p; p = ""; print; next } /^(- |#)/ { if (p != "") print p; p = $0; next }
                   { sub(/^ +/, ""); p = (p == "" ? $0 : p " " $0) } END { if (p != "") print p }' > notes.md
          test -s notes.md
      - name: The updater's latest.json
        working-directory: out
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          platforms='{}'
          add() { # add <platform key> <file>: the file's URL and the text of its .sig
            platforms=$(jq --arg k "$1" --arg url "$base/$2" --rawfile sig "$2.sig" '. + {($k): {url: $url, signature: $sig}}' <<<"$platforms")
          }
          # Keys are {os}-{arch}-{installer}, with {os}-{arch} as the fallback the updater tries next.
          for sig in *.sig; do
            f="${sig%.sig}"
            case "$f" in
              *.AppImage) add linux-x86_64-appimage "$f"; add linux-x86_64 "$f" ;;
              *.deb) add linux-x86_64-deb "$f" ;;
              *.rpm) add linux-x86_64-rpm "$f" ;;
              *-setup.exe) add windows-x86_64-nsis "$f"; add windows-x86_64 "$f" ;;
              *_en-US.msi) add windows-x86_64-msi "$f" ;;
              *_universal.app.tar.gz) for k in darwin-aarch64 darwin-x86_64 darwin-aarch64-app darwin-x86_64-app; do add "$k" "$f"; done ;;
            esac
          done
          # One per system at least, or installed copies of that system would never see this release.
          for k in linux-x86_64 windows-x86_64 darwin-aarch64; do jq -e --arg k "$k" 'has($k)' <<<"$platforms" >/dev/null; done
          jq -n --arg v "${GITHUB_REF_NAME#v}" --rawfile notes ../notes.md --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" '{version: $v, notes: $notes, pub_date: $date, platforms: $platforms}' > latest.json
          jq '.platforms | keys' latest.json
      - name: One checksum file
        working-directory: out
        run: |
          rm SHA256SUMS-*.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" out/* --draft --verify-tag --title "oopz $version" --notes-file notes.md
