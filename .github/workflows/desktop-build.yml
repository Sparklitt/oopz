name: Desktop installers

# Builds the desktop app's installers on Linux, Windows and macOS when started by hand (Actions › Desktop installers ›
# Run workflow), and keeps them as the run's artifacts with their SHA-256 checksums. It publishes nothing: no release,
# no tag. The installers are unsigned (Windows SmartScreen and macOS Gatekeeper will warn) until the signing decision
# (docs/desktop-plan.md, milestone 4).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: an older glibc, so the AppImage and .deb run on more Linux systems.
          - { os: ubuntu-22.04, name: linux, args: "" }
          - { os: windows-latest, name: windows, args: "" }
          - { os: macos-latest, name: macos, args: "--target universal-apple-darwin" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      # `tauri build` runs `pnpm build` first (beforeBuildCommand), then cargo with the shell's Cargo.lock.
      - run: pnpm tauri build ${{ matrix.args }} -- --locked
      - name: Collect installers and checksums
        shell: bash
        run: |
          mkdir -p ../../out
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \) \
            -exec cp {} ../../out/ \;
          cd ../../out
          ls -la
          if command -v sha256sum >/dev/null; then sha256sum * > SHA256SUMS-${{ matrix.name }}.txt; else shasum -a 256 * > SHA256SUMS-${{ matrix.name }}.txt; fi
      - uses: actions/upload-artifact@v7
        with:
          name: oopz-desktop-${{ matrix.name }}
          path: out/
          if-no-files-found: error
