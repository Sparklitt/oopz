<text x="480.0" y="27" text-anchor="middle" class="dim" style="font-size:13px">oops — synthetic backups, test keys</text>
<g class="k1"><text class="p" x="24" y="64">$</text><text class="c" x="42.0" y="64" textLength="261.0" lengthAdjust="spacing">oops backups --dir Databases/</text>
<g class="v1"><rect x="42.0" y="49" width="960" height="22" fill="#15162E"/><rect class="cur b1" x="42.0" y="50" width="9" height="18"/></g></g>
<text class="dim k2" x="24" y="86">64-digit backup key (not shown): </text>
<text class="ok k3" x="24" y="108">msgstore.db.crypt15  0 MB  ok: 2 chats, 19 messages, last 2023-11-14</text>
<g class="k4"><text class="p" x="24" y="64">$</text><text class="c" x="42.0" y="64" textLength="441.0" lengthAdjust="spacing">oops chats --backup Databases/msgstore.db.crypt15</text>
<g class="v4"><rect x="42.0" y="49" width="960" height="22" fill="#15162E"/><rect class="cur b4" x="42.0" y="50" width="9" height="18"/></g></g>
<text class="dim k5" x="24" y="86">64-digit backup key (not shown): </text>
<text class="head k6" x="24" y="108"> chat  who                   messages  last message</text>
<text class="o k7" x="24" y="130">    1  contact ••••001             18  2023-11-14</text>
<text class="o k8" x="24" y="152">    2  group ••••001                1  2023-11-14</text>
<g class="k9"><text class="p" x="24" y="64">$</text><text class="c" x="42.0" y="64" textLength="459.0" lengthAdjust="spacing">oops restore --source ana.crypt15 --source-chat 1 \</text>
<g class="v9"><rect x="42.0" y="49" width="960" height="22" fill="#15162E"/><rect class="cur b9" x="42.0" y="50" width="9" height="18"/></g></g>
<g class="k10"><text class="p" x="24" y="86">></text><text class="c" x="42.0" y="86" textLength="603.0" lengthAdjust="spacing">    --target ben.crypt15 --target-chat 2 --out ben-restored.crypt15</text>
<g class="v10"><rect x="42.0" y="71" width="960" height="22" fill="#15162E"/><rect class="cur b10" x="42.0" y="72" width="9" height="18"/></g></g>
<text class="dim k11" x="24" y="108">64-digit source key (not shown): </text>
<text class="dim k12" x="24" y="130">64-digit target key (not shown): </text>
<text class="o k13" x="24" y="152">target chat: 4 messages before</text>
<text class="o k14" x="24" y="174">source chat: 2 already there, 8 added</text>
<text class="o k15" x="24" y="196">media: 2 new paths, 1 reuse a file the target has, 0 unsafe paths dropped; calls reused: 1</text>
<text class="dim k16" x="24" y="218">  copied message: 8</text>
<text class="dim k17" x="24" y="240">  …</text>
<text class="ok k18" x="24" y="262">check decrypts with the target's key: yes</text>
<text class="ok k19" x="24" y="284">check integrity_check: ok</text>
<text class="ok k20" x="24" y="306">check chat messages: 4 + 8 = 12</text>
<text class="ok k21" x="24" y="328">check other chats and the chat's own messages: identical, in order</text>
<text class="dim k22" x="24" y="350">  …</text>
<text class="accent k23" x="24" y="372">written: ben-restored.crypt15 (5331 bytes)</text>
<text class="o k24" x="24" y="394">next: oops chat-facts --backup ben-restored.crypt15 --chat 2</text>
