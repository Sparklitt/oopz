<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="oopz: your own chat history, from every app, in one place. Search, select, export, restore a lost chat. Offline.">
  <style>.bg{fill:#F6F4F0}.bg2{fill:#EBE7E0}.ink{fill:#1D201D}.soft{fill:#62665F}.markbg{fill:#2F5D4F}.accenttext{fill:#2F5D4F}.accentsoft{fill:#DBE8E2}.accentstroke{stroke:#2F5D4F}.flow{stroke:#2F5D4F}.card{fill:#FFFFFF;stroke:#E3DFD7;stroke-width:2}.bar{fill:#D6D2CA}.chip{fill:#2F5D4F}.chiptext{fill:#FFFFFF}</style>
  <rect class="bg" width="1280" height="640"/>
  <circle class="bg2" cx="1130" cy="320" r="230"/>

  <g transform="translate(132 150) scale(1.75)">
    <rect class="markbg" width="64" height="64" rx="15"/>
    <path d="M17.5 32a14.5 14.5 0 1 0 4.25-10.25" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <path d="M15.5 14.5v10.25h10.25" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"
          stroke-linejoin="round"/>
    <circle cx="32" cy="32" r="3.6" fill="#fff"/>
  </g>
  <text class="ink" x="268" y="246" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="104" font-weight="800"
        letter-spacing="-3">oopz</text>

  <text class="ink" x="132" y="356" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="36" font-weight="700">Your own chat history,</text>
  <text class="ink" x="132" y="402" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="36" font-weight="700">from every app, in one
    place.</text>
  <text class="soft" x="132" y="452" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="24">Search, select, export, restore a lost chat.
    <tspan class="accenttext" font-weight="700">Offline.</tspan></text>

  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="19" font-weight="600">
    <rect class="chip" x="132" y="510" width="88" height="36" rx="18"/>
    <text class="chiptext" x="176" y="534" text-anchor="middle">Rust</text>
    <rect class="chip" x="232" y="510" width="132" height="36" rx="18"/>
    <text class="chiptext" x="298" y="534" text-anchor="middle">AGPL-3.0</text>
    <rect class="chip" x="376" y="510" width="182" height="36" rx="18"/>
    <text class="chiptext" x="467" y="534" text-anchor="middle">no network, ever</text>
    <rect class="chip" x="570" y="510" width="214" height="36" rx="18"/>
    <text class="chiptext" x="677" y="534" text-anchor="middle">desktop · Android · CLI</text>
  </g>

  <!-- motif: each app's export or backup flows into one library -->
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif">
    <rect class="card" x="682" y="118" width="218" height="44" rx="22"/><text class="ink" x="791" y="147" text-anchor="middle" font-size="18" font-weight="600">WhatsApp · Android</text><path class="flow" d="M906 140 C 960 140, 950 320, 1010 320" fill="none" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><rect class="card" x="693" y="184" width="207" height="44" rx="22"/><text class="ink" x="796" y="213" text-anchor="middle" font-size="18" font-weight="600">WhatsApp · iPhone</text><path class="flow" d="M906 206 C 960 206, 950 320, 1010 320" fill="none" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><rect class="card" x="784" y="250" width="116" height="44" rx="22"/><text class="ink" x="842" y="279" text-anchor="middle" font-size="18" font-weight="600">Telegram</text><path class="flow" d="M906 272 C 960 272, 950 320, 1010 320" fill="none" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><rect class="card" x="835" y="316" width="65" height="44" rx="22"/><text class="ink" x="868" y="345" text-anchor="middle" font-size="18" font-weight="600">SMS</text><path class="flow" d="M906 338 C 960 338, 950 320, 1010 320" fill="none" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><rect class="card" x="825" y="382" width="75" height="44" rx="22"/><text class="ink" x="863" y="411" text-anchor="middle" font-size="18" font-weight="600">LINE</text><path class="flow" d="M906 404 C 960 404, 950 320, 1010 320" fill="none" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><rect class="card" x="815" y="448" width="85" height="44" rx="22"/><text class="ink" x="858" y="477" text-anchor="middle" font-size="18" font-weight="600">Viber</text><path class="flow" d="M906 470 C 960 470, 950 320, 1010 320" fill="none" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/>
  </g>
  <g>
    <rect class="card" x="1010" y="230" width="190" height="180" rx="30"/>
    <rect class="accentsoft" x="1032" y="254" width="146" height="34" rx="17"/>
    <rect class="bar" x="1032" y="304" width="120" height="10" rx="5"/>
    <rect class="bar" x="1032" y="324" width="90" height="10" rx="5"/>
    <rect class="bar" x="1032" y="352" width="130" height="10" rx="5"/>
    <rect class="bar" x="1032" y="372" width="70" height="10" rx="5"/>
    <g fill="none" class="accentstroke" stroke-width="5" stroke-linecap="round">
      <circle cx="1052" cy="271" r="8"/><path d="M1058 277 L1065 284"/>
    </g>
  </g>
</svg>
