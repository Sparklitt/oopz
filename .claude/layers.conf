# Layering rules (format: scripts/layers.sh), from the decisions in docs/decisions.
# 0013: the model has no I/O and knows no other oopz crate.
crates/oopz-model/Cargo.toml !-> ^(oopz|oopz-.*|rusqlite|tempfile|fs4|zip|tiny_http|if-addrs|image)$ +dev
# 0014, 0016: the library depends on the model only; adapters are handed to it.
crates/oopz-core/Cargo.toml !-> ^(oopz|oopz-(app|cli|export|export-pdf|gen|ios-backup|whatsapp-ios|whatsapp-export|telegram-export|sms-xml|line-export|viber-export))$
# 0013: one crate per adapter, built and tested alone: no adapter uses another, the library, the app or the exports.
crates/adapters/*/Cargo.toml !-> ^(oopz|oopz-(app|cli|core|export|export-pdf|whatsapp-ios|whatsapp-export|telegram-export|sms-xml|line-export|viber-export))$
# oopz-gen writes synthetic test data: a dev-dependency only, never in a build.
crates/**/Cargo.toml !-> ^oopz-gen$
